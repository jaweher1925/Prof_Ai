
services:
  api:
    image: jaweherhichri1925/profai-api:latest
    build: ./api
    environment:
      - DATABASE_URL=file:/data/profai.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - HEYGEN_API_KEY=${HEYGEN_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    volumes:
      - profai-db:/data
      - profai-uploads:/home/site/wwwroot/uploads
    restart: unless-stopped

  web:
    image: jaweherhichri1925/profai-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  profai-db:
  profai-uploads:
