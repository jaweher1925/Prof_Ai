name: Build and push Docker images

# Builds the ProfAI web + api images and pushes them to Docker Hub.
# Runs on every push to the branches below, or manually from the Actions tab.
on:
  push:
    branches: [ main, Last_version_djo ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Frontend image (nginx + built React app) ──────────────────────────
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/profai-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/profai-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Backend image (Azure Functions API) ───────────────────────────────
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/profai-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/profai-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
