server {
  listen 80;
  client_max_body_size 200M;          # match the API's upload limit

  # Frontend (SPA — all routes fall back to index.html)
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API → api container (Azure Functions host listens on :80)
  location /api/ {
    proxy_pass http://api:80/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 900s;          # video/avatar renders take minutes
    proxy_send_timeout 900s;
  }

  # Mirror the Vite dev proxy: /uploads/... → /api/uploads/...
  location /uploads/ {
    proxy_pass http://api:80/api/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
